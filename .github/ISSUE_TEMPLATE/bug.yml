name: 问题报告（Bug）
description: 某个功能报错、界面显示不对、装不上 —— 都在这里报
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**最有用的一条信息是 `./netdev doctor` 的输出** ——
        它会直接指出哪一项体检没过，比大段描述都管用。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 你做了什么操作、期望发生什么、实际发生了什么（贴报错原文，别翻译）
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "./netdev doctor 输出"
      description: 在 netdev 目录里跑 `./netdev doctor`，把完整输出贴上来
      placeholder: |
        netdev 体检（14/15 通过）
          ✔ …
          ! …
      render: shell
    validations:
      required: true

  - type: input
    id: install-way
    attributes:
      label: 安装方式
      description: 离线安装包 / git clone 源码运行
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      placeholder: "例如：macOS 15.3（Apple Silicon M2）"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他信息（可选）
      description: 截图、日志片段（**贴之前删掉设备密码、真实 IP、序列号**）
